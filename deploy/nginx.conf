# /etc/nginx/sites-available/stonkflyrh — stonkflyrh.com in front of the read-only site.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/stonkflyrh
#   sudo ln -s /etc/nginx/sites-available/stonkflyrh /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx
#   sudo snap install --classic certbot && sudo certbot --nginx -d stonkflyrh.com -d www.stonkflyrh.com
#
# DNS first: an A record for stonkflyrh.com and one for www pointing at the server.
# certbot rewrites this file to add the TLS block and the 80→443 redirect.
server {
    listen 80;
    listen [::]:80;
    server_name stonkflyrh.com www.stonkflyrh.com;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Server-sent events: no buffering, and a long read timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy no-referrer;
    }
}
