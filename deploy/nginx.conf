# /etc/nginx/sites-available/stonkflyrh — serves the read-only site publicly.
# The server-sent events stream needs buffering off and a long read timeout.
server {
    listen 80;
    server_name fly.example.com;   # your domain; add certbot for TLS

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy no-referrer;
    }
}
